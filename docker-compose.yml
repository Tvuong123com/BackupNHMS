services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nhms-db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=MatKhauCuaBan123!
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "MatKhauCuaBan123!", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nhms-db-init
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
      [ ! -f $$SQLCMD ] && SQLCMD=/opt/mssql-tools/bin/sqlcmd;
      echo 'Waiting for SQL Server...';
      for i in {1..30}; do
        $$SQLCMD -S db -U sa -P 'MatKhauCuaBan123!' -C -Q 'SELECT 1' &> /dev/null;
        if [ $$? -eq 0 ]; then
          echo 'SQL Server is online. Creating database NURSING_HOME_DB if not exists...';
          $$SQLCMD -S db -U sa -P 'MatKhauCuaBan123!' -C -Q \"IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = N'NURSING_HOME_DB') CREATE DATABASE NURSING_HOME_DB;\";
          break;
        fi;
        sleep 2;
      done;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nhms-backend:latest
    container_name: nhms-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=NURSING_HOME_DB
      - DB_USERNAME=sa
      - DB_PASSWORD=MatKhauCuaBan123!
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080
    image: nhms-frontend:latest
    container_name: nhms-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
